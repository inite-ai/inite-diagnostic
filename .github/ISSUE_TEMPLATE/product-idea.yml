name: Product idea
description: Something you want the INITE process diagnostic (this MCP server, or the inite.solutions audit behind it) to make possible. Plain words are fine.
title: "idea: "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        No engineering knowledge needed. If an AI agent helped you (`/contribute` or `/spec-idea`
        in Claude Code, or "read AGENTS.md"), paste its spec at the bottom.
        Use made-up numbers, not a real business's answers, and never paste a token.
  - type: textarea
    id: what
    attributes:
      label: What do you want to be possible?
      placeholder: "e.g. read_answers also says how many enquiries each person handles per hour"
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for / why
      placeholder: Who needs this, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How would you know it works?
      placeholder: Example answers, and what you would expect the tool to say.
    validations:
      required: true
  - type: checkboxes
    id: parts
    attributes:
      label: Which part does it touch?
      description: Best guess; "not sure" is fine.
      options:
        - label: The local interview or arithmetic (diagnostic_questions, read_answers)
        - label: Sign-in, or how the package connects to inite.solutions
        - label: The audit itself — findings, premium questions, a new field, payment (server-side)
        - label: Not sure
  - type: textarea
    id: spec
    attributes:
      label: Spec (if an agent wrote one)
      description: Problem, what the tool says, tool surface change, risks, out of scope, zone.
    validations:
      required: false
